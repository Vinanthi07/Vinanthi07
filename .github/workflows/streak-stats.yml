name: Update streak stats

on:
  schedule:
    - cron: "*/5 * * * *"   # runs every 5 minutes
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Streak Stats
        uses: JonahMorrow/github-readme-streak-stats@v1.6.0
        with:
          user: Vinanthi07
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats [skip ci]" || exit 0
          git push
