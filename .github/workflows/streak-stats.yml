name: Update streak stats

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Vinanthi07&theme=dark&hide_border=true&background=0D1117&ring=00FF9C&fire=FF3864&currStreakLabel=00FF9C&sideLabels=c9d1d9&currStreakNum=ffffff&sideNums=ffffff&dates=6b7280
          path: profile/streak.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # 🆕 NEW: Update the timestamp in README.md
      - name: Update graph timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          sed -i "s/&t=[0-9]*/&t=$TIMESTAMP/g" README.md
          sed -i "s/&v=[0-9]*/&v=$TIMESTAMP/g" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg README.md
          git commit -m "Update streak stats and graph [skip ci]" || exit 0
          git push