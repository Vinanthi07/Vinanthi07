name: Update streak stats

on:
  schedule:
    - cron: "0 */3 * * *"   # runs every 3 hours
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=Vinanthi07
            &hide_border=true
            &background=000000
            &ring=00FF41
            &fire=39FF14
            &currStreakNum=00FF41
            &sideNums=39FF14
            &currStreakLabel=00FF41
            &sideLabels=39FF14
            &dates=6bff8f
            &stroke=00FF41
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "> sys.update(streak_stats) [skip ci]" || exit 0
          git push
