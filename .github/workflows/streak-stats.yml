name: Update GitHub stats

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch: {}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=Vinanthi07
            &hide_border=true
            &background=000000
            &ring=00FF41
            &fire=39FF14
            &currStreakNum=00FF41
            &sideNums=39FF14
            &currStreakLabel=00FF41
            &sideLabels=39FF14
            &dates=6bff8f
            &stroke=00FF41
            &timezone=Asia/Kolkata
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Vinanthi07
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          config_display: large
          config_timezone: Asia/Kolkata
          config_output: svg
          output_action: none
          filename: profile/stats.svg

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Vinanthi07
          template: classic
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_output: svg
          output_action: none
          filename: profile/activity-graph.svg

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg profile/stats.svg profile/activity-graph.svg
          git commit -m "> sys.update(metrics) [skip ci]" || exit 0
          git push
