name: Update GitHub stats
on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch: {}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=Vinanthi07
            &hide_border=true
            &background=000000
            &ring=00FF41
            &fire=39FF14
            &currStreakNum=00FF41
            &sideNums=39FF14
            &currStreakLabel=00FF41
            &sideLabels=39FF14
            &dates=6bff8f
            &stroke=00FF41
            &timezone=Asia/Kolkata
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}
      - name: Commit streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "> sys.update(streak) [skip ci]" || echo "no changes"
          git push
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Vinanthi07
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          config_display: large
          config_timezone: Asia/Kolkata
          config_output: svg
          filename: profile/stats.svg
          output_action: commit
          committer_message: "> sys.update(stats) [skip ci]"
      - name: Generate line-style contribution graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Vinanthi07
          template: classic
          base: ""
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30
          config_display: large
          config_timezone: Asia/Kolkata
          config_output: svg
          filename: profile/contribution-graph.svg
          output_action: commit
          committer_message: "> sys.update(contribution-graph) [skip ci]"
