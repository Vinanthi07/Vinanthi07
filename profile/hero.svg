<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
    
    <defs>
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1a0b2e"/>
        <stop offset="35%" stop-color="#3b0f5c"/>
        <stop offset="60%" stop-color="#7a1f8e"/>
        <stop offset="80%" stop-color="#ff4da6"/>
        <stop offset="100%" stop-color="#ff9770"/>
      </linearGradient>
      <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff2b8"/>
        <stop offset="45%" stop-color="#ff9de2"/>
        <stop offset="100%" stop-color="#ff4d94"/>
      </linearGradient>
      <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
      </linearGradient>
      <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f5ff"/>
        <stop offset="50%" stop-color="#ff61d8"/>
        <stop offset="100%" stop-color="#b967ff"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <clipPath id="clipRound"><rect x="0" y="0" width="1200" height="9999" rx="18"/></clipPath>
    </defs>
    
